<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gota Certa (versão verde)</title>
<style>
:root{--fundo:#0f172a;--cartao:#1e293b;--texto:#e2e8f0;--cor:#22c55e}
*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:var(--fundo);color:var(--texto)}
header{padding:18px 28px;display:flex;justify-content:space-between;border-bottom:1px solid #334155}
header b{font-size:20px;color:var(--cor)}
main{display:flex;justify-content:center;padding:60px 16px}
.cartao{background:var(--cartao);border-radius:20px;padding:36px 28px;width:min(420px,100%);text-align:center}
h1{margin:0 0 8px;font-size:28px}.n{font-size:72px;font-weight:800;color:var(--cor)}
.barra{height:12px;background:#0b1220;border-radius:99px;margin:20px 0}.barra i{display:block;height:100%;width:40%;background:var(--cor);border-radius:99px}
button{font-size:18px;border:0;border-radius:12px;padding:12px 22px;margin:4px;background:var(--cor);color:#0f172a}
</style></head>
<body><header><b>Gota Certa</b><span>Hoje · Histórico · Ajustes</span></header>
<main><div class="cartao"><h1>Quantos copos hoje?</h1><p>Meta do dia: 8 copos.</p><div class="n">3</div>
<div class="barra"><i></i></div><button>−</button><button>+ 1 copo</button><button>Zerar</button></div></main></body></html>
